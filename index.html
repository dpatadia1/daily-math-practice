<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Math Practice</title>
<style>
  body{margin:0;background:#fdfbf7;color:#1b1a17;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       font-size:16px;line-height:1.55}
  .wrap{max-width:620px;margin:0 auto;padding:40px 20px}
  h1{font-family:"Iowan Old Style",Georgia,serif;font-size:28px;margin:0 0 6px;font-weight:600}
  p.sub{color:#6b675f;margin:0 0 28px;font-size:15px}
  ul{list-style:none;padding:0;margin:0}
  li{border-bottom:1px solid #e5e0d6}
  a{display:block;padding:15px 4px;text-decoration:none;color:#3b4c9e;font-weight:600}
  a:hover{background:#eef1fb}
  a .d{color:#6b675f;font-weight:400;font-size:14px;display:block;margin-top:2px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Daily Math Practice</h1>
  <p class="sub">Middle school honors · a new set each weekday</p>
  <ul id="list"></ul>
</div>
<script>
/* Newest first. Each day's run adds one line here. */
const SETS = [
  {file:"2026-11-10.html", label:"Tuesday, November 10, 2026", topic:"Percents — Tax, Tip, Discount, Markup, Percent Change & Simple Interest"},
  {file:"2026-11-09.html", label:"Monday, November 9, 2026", topic:"Equations & Inequalities"},
  {file:"2026-11-06.html", label:"Friday, November 6, 2026", topic:"Expressions, Properties, Exponents & Order of Operations"},
  {file:"2026-11-03.html", label:"Tuesday, November 3, 2026", topic:"Integers, Absolute Value, Rational Numbers & the Coordinate Plane"},
  {file:"2026-11-02.html", label:"Monday, November 2, 2026", topic:"Fractions & Decimals — Operations and Division"},
  {file:"2026-10-30.html", label:"Friday, October 30, 2026", topic:"Ratios, Rates & Proportional Relationships"},
  {file:"2026-10-29.html", label:"Thursday, October 29, 2026", topic:"Ratios, Rates & Proportional Relationships"}
];
document.getElementById("list").innerHTML = SETS.map(s =>
  `<li><a href="${s.file}">${s.label}<span class="d">${s.topic}</span></a></li>`).join("");
</script>
</body>
</html>
